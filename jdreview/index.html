<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JD Review Generator</title>
<meta name="robots" content="noindex,nofollow">
<link rel="stylesheet" href="/style.css">
<script async src="https://huntsales.io/api/tracking/script?t=9396c69016b3d10f2ddeb897da888778"></script>
</head>

<body>

<header>
<div class="container nav-container">
<div class="logo">
<img width="480" height="152" decoding="async" src="/images/logo.webp" alt="BizGrants Consulting" class="logo-img" fetchpriority="high" />
</div>
</div>
</header>

<section class="hero">
<div class="container">
<h1>JD Review Generator</h1>
<p>Create a client review page for job description refinement</p>
</div>
</section>

<main class="main-content">

<div class="container">

<div class="card">

<h2>Project Details</h2>

<label for="company">Client Company</label>
<input id="company">

<label for="role">Job Title</label>
<input id="role">

<label for="staff">Staff Name</label>
<input id="staff">

<h2>Current Job Description</h2>
<textarea id="currentJD" rows="12" aria-label="Current JD"></textarea>

<h2>Suggested Job Description</h2>
<textarea id="suggestedJD" rows="12" aria-label="Suggested JD"></textarea>

<button class="cta-btn" onclick="generate()">Generate Client Review Link</button>

<div id="result" style="margin-top:20px;"></div>

</div>

</div>

</main>

<script>

function generate(){

const company = document.getElementById("company").value
const role = document.getElementById("role").value
const staff = document.getElementById("staff").value

const current = document.getElementById("currentJD").value
const suggested = document.getElementById("suggestedJD").value

const key = company + "_" + role + "_" + staff

localStorage.setItem(key + "_current", current)
localStorage.setItem(key + "_suggested", suggested)

const url =
"https://bizgrants.consulting/jdreview/review.html?company="
+ encodeURIComponent(company)
+ "&role=" + encodeURIComponent(role)
+ "&staff=" + encodeURIComponent(staff)

document.getElementById("result").innerHTML =
"<p>Send this link to the client:</p>" +
"<a href='"+url+"' target='_blank'>" + url + "</a>"

}

</script>

</body>
</html>
